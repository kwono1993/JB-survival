<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JB 서바이벌 🦑</title>
<style>
  :root{
    --bg:#0d0f14; --bg2:#171a23; --card:#222634; --line:#323849;
    --ink:#f5f6fa; --mute:#9096a8; --pink:#ff2e7e; --teal:#13c2a3; --gold:#ffcf3f; --red:#ff4d5e;
    --z0:#2f7cf6; --z1:#ff4d5e; --q0:#ffb020; --q1:#20c07a; --q2:#2f7cf6; --q3:#b35cf5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#app{height:100%}
  body{background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;border:0;cursor:pointer;border-radius:14px;padding:.7em 1.4em;font-weight:800;background:var(--pink);color:#fff}
  button.ghost{background:transparent;color:var(--mute);border:2px solid var(--line)}
  input{font:inherit;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);padding:.6em .8em}
  .banner{position:fixed;left:0;right:0;bottom:0;background:#ff9f1a;color:#1b1b1b;font-size:12px;font-weight:700;text-align:center;padding:4px;z-index:60}
  .shapes{letter-spacing:.2em;color:var(--pink);font-weight:900}

  /* ---------- 경기장(공통) ---------- */
  .arena{position:relative;border-radius:18px;overflow:hidden;background:var(--bg2);touch-action:none}
  .zone{position:absolute;border:2px solid rgba(255,255,255,.08);transition:filter .4s,opacity .4s,box-shadow .4s}
  .zone .zl{position:absolute;display:flex;flex-direction:column;align-items:center;gap:.2em;padding:.6em;text-align:center;pointer-events:none;opacity:.95}
  .zone .zl b{font-weight:900;line-height:1}
  .zone .zl span{font-weight:800;line-height:1.25;word-break:keep-all}
  .zone .zc{position:absolute;right:.5em;bottom:.4em;font-weight:900;opacity:.75;pointer-events:none}
  .z2 .zl{left:0;right:0;top:6%}
  .z4-0 .zl,.z4-2 .zl{left:2%;align-items:flex-start;text-align:left;max-width:70%}
  .z4-1 .zl,.z4-3 .zl{right:2%;align-items:flex-end;text-align:right;max-width:70%}
  .z4-0 .zl,.z4-1 .zl{top:3%} .z4-2 .zl,.z4-3 .zl{bottom:3%}
  .z4-0 .zc,.z4-2 .zc{right:auto;left:.6em} .z4-2 .zc,.z4-3 .zc{bottom:auto;top:.4em}
  .zone.correct{filter:brightness(1.35);box-shadow:inset 0 0 0 6px var(--gold);z-index:1}
  .zone.wrong{filter:grayscale(1) brightness(.35)}
  .startc{position:absolute;left:41%;top:41%;width:18%;height:18%;border-radius:50%;border:3px dashed rgba(255,255,255,.35);
    background:rgba(13,15,20,.55);display:grid;place-items:center;z-index:1;pointer-events:none}
  .startc span{color:rgba(255,255,255,.55);font-weight:800}
  .ch{position:absolute;transform:translate(-50%,-60%);display:flex;flex-direction:column;align-items:center;z-index:3;pointer-events:none;will-change:left,top}
  .ch .e{line-height:1}
  .ch .n{font-weight:800;background:rgba(0,0,0,.55);border-radius:6px;padding:0 .35em;white-space:nowrap;max-width:7em;overflow:hidden;text-overflow:ellipsis}
  .ch.walk .e{animation:bob .2s infinite alternate}
  .ch.me .n{background:var(--pink)}
  .ch.dead{animation:die 1.6s forwards;z-index:4}
  .ch.saved .e{animation:jump .5s 3}
  @keyframes bob{from{transform:translateY(-6%) rotate(-7deg)}to{transform:translateY(6%) rotate(7deg)}}
  @keyframes die{0%{transform:translate(-50%,-60%)}8%{transform:translate(-56%,-60%)}16%{transform:translate(-44%,-60%)}24%{transform:translate(-56%,-60%)}32%{transform:translate(-50%,-60%) rotate(0)}
    60%{transform:translate(-50%,-30%) rotate(90deg);opacity:1;filter:grayscale(1)}100%{transform:translate(-50%,-30%) rotate(90deg);opacity:0;filter:grayscale(1)}}
  @keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-35%)}}

  svg.av{display:block;width:1em;height:1.32em;overflow:visible}
  svg.avh{height:.87em}
  .bigcount{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none}
  .bigcount span{font-weight:900;line-height:1;color:var(--red);opacity:.82;font-variant-numeric:tabular-nums;
    text-shadow:0 0 .12em #000,0 .04em 0 rgba(0,0,0,.5);animation:bigpop .9s ease-out both}
  .host .bigcount span{font-size:52vh}
  .stage .bigcount span{font-size:200px}
  @keyframes bigpop{0%{transform:scale(1.7);opacity:0}25%{transform:scale(1);opacity:.9}100%{transform:scale(.92);opacity:.6}}
  .mid{flex:1;display:flex;gap:2vw;min-height:0}
  .mid .panel{flex:1;border-radius:2.4vh;padding:2.4vh 2vw;display:flex;flex-direction:column;gap:2vh;min-width:0;background:var(--bg2);border:3px solid var(--teal)}
  .mid .panel.out{border-color:var(--red);flex:.8}
  .mid h2{font-size:4.6vh;font-weight:900}
  .mid h2 b{font-size:7vh;color:var(--teal)} .mid .out h2 b{color:var(--red)}
  .mid .list{flex:1;display:flex;flex-wrap:wrap;gap:3.5vh 1.4vw;align-content:flex-start;justify-content:center;padding-top:3vh}
  .mid .who{display:flex;flex-direction:column;align-items:center;gap:.4vh;animation:rise .5s ease-out both}
  .mid .who .n{font-size:.2em;font-weight:800;max-width:6em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mid .pass .who .e{animation:hop .6s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10%)}}
  .mid .out .who{animation:fall 1s ease-in both}
  .mid .out .who .e{filter:grayscale(1) brightness(.7)}
  .mid .out .who .n{color:var(--mute);text-decoration:line-through}
  .mid .none{margin:auto;color:var(--mute);font-size:3vh;font-weight:800}
  @keyframes fall{0%{transform:translateY(-30vh) rotate(0);opacity:0}60%{transform:translateY(0) rotate(0);opacity:1}80%{transform:rotate(-14deg)}100%{transform:rotate(-8deg)}}
  /* ---------- 진행자 ---------- */
  .host{height:100%;display:flex;flex-direction:column;padding:2vh 2vw;gap:1.6vh}
  .host header{display:flex;align-items:center;gap:1.2vw;min-height:7vh}
  .host header h1{font-size:4vh;letter-spacing:-.02em;white-space:nowrap}
  .host header .sp{flex:1}
  .pill{background:var(--card);border-radius:999px;padding:.6vh 1.2vw;font-size:2.4vh;font-weight:800;color:var(--mute);white-space:nowrap}
  .pill b{color:var(--gold)}
  .qtext{flex:1;font-size:4.4vh;font-weight:900;line-height:1.3;word-break:keep-all}
  .tbox{font-size:11vh;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;width:14vh;text-align:center;color:var(--teal)}
  .tbox.hot{color:var(--red);animation:pulse .5s infinite alternate}
  @keyframes pulse{to{transform:scale(1.12)}}
  .tbar{height:1vh;border-radius:9px;background:var(--card);overflow:hidden}
  .tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--gold),var(--teal));transform-origin:left}
  .host .body{flex:1;display:flex;gap:1.6vw;min-height:0}
  .host .arena{flex:1}
  .host .arena .zl b{font-size:9vh}
  .host .arena .z4 .zl b{font-size:7vh}
  .host .arena .zl span{font-size:5.4vh;max-width:32vw}
  .host .arena .zc{font-size:3.4vh}
  .host .arena .startc span{font-size:2.2vh}
  .host .ch .e{font-size:8vh} .host .ch .n{font-size:1.6vh}
  .qrbox{width:34vh;flex:none;background:#fff;color:#111;border-radius:2.4vh;padding:2.4vh;display:flex;flex-direction:column;align-items:center;gap:1.2vh;align-self:flex-start}
  .qrbox #qr{width:100%;aspect-ratio:1}
  .qrbox #qr svg{width:100%;height:100%}
  .qrbox .code{font-size:5vh;font-weight:900;letter-spacing:.15em}
  .qrbox p{font-size:1.8vh;text-align:center;color:#444;word-break:break-all}
  .noqr{height:100%;display:grid;place-items:center;text-align:center;color:#888;font-size:2vh;border:2px dashed #ccc;border-radius:2vh}
  .lobbymsg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:4vh;font-weight:900;color:rgba(255,255,255,.18);pointer-events:none}
  .lobbymsg b{display:block;font-size:12vh;color:rgba(255,46,126,.35)}
  .host footer{display:flex;align-items:center;gap:1.2vw;min-height:7vh}
  .host footer button{font-size:2.8vh}
  .alive{font-size:3vh;font-weight:900;white-space:nowrap}
  .alive b{color:var(--teal);font-size:4.4vh}
  .ghosts{flex:1;display:flex;flex-wrap:wrap;gap:.4vw;align-items:center;min-width:0;overflow:hidden;max-height:7vh}
  .ghosts span{font-size:4vh;filter:grayscale(1);opacity:.45}
  .ghosts em{font-style:normal;color:var(--mute);font-size:2vh;font-weight:700;margin-right:.4vw}
  .verdict{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;background:#0d0f14;box-shadow:0 2vh 6vh rgba(0,0,0,.6);border:3px solid var(--pink);
    border-radius:3vh;padding:3vh 5vw;text-align:center;animation:pop .5s ease-out;pointer-events:none}
  .verdict h2{font-size:6vh;font-weight:900}
  .verdict p{font-size:3vh;color:var(--mute);margin-top:1vh}
  .verdict p b{color:var(--ink)}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}70%{transform:translate(-50%,-50%) scale(1.06)}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
  .endwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh}
  .endwrap h2{font-size:8vh;font-weight:900}
  .winners{display:flex;flex-wrap:wrap;justify-content:center;gap:3vw;max-width:90vw}
  .winner{display:flex;flex-direction:column;align-items:center;gap:.6vh;animation:rise .7s ease-out both}
  .winner .c{font-size:6vh}
  .winner .e{font-size:16vh;line-height:1}
  .winner .n{font-size:4vh;font-weight:900}
  @keyframes rise{from{transform:translateY(8vh);opacity:0}to{transform:none;opacity:1}}

  /* ---------- 참가자 ---------- */
  .pl{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));gap:16px;text-align:center}
  .pl h1{font-size:30px}
  .pl .sub{color:var(--mute);font-size:15px;line-height:1.5}
  .pl input{width:100%;max-width:320px;font-size:20px;text-align:center}
  .emgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:320px}
  .emgrid button{font-size:30px;padding:6px 0;background:var(--bg2);border:2px solid transparent;border-radius:12px}
  .emgrid button.sel{border-color:var(--pink);background:var(--card)}
  .pl.join{justify-content:flex-start;gap:10px;padding-top:14px}
  .jtop{display:flex;gap:14px;align-items:center;width:100%;max-width:360px}
  .pvw{font-size:88px;background:var(--bg2);border-radius:18px;padding:6px 16px}
  .jside{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  .pl .jside input{width:100%;font-size:18px}
  .jside button{font-size:15px;padding:.5em}
  .tabs{display:flex;gap:6px;width:100%;max-width:360px}
  .tabs button{flex:1;padding:.6em 0;font-size:15px;background:var(--bg2);color:var(--mute);border-radius:10px}
  .tabs button.sel{background:var(--pink);color:#fff}
  .opts{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:360px;text-align:left;-webkit-overflow-scrolling:touch}
  .opts h4{font-size:13px;color:var(--mute);margin:6px 2px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .oc{padding:3px;background:var(--bg2);border:2px solid transparent;border-radius:12px;display:grid;place-items:center}
  .oc.sel{border-color:var(--pink);background:var(--card)}
  .oc svg.av{width:100%;height:auto}
  .sw{aspect-ratio:1;border-radius:50%;border:3px solid var(--bg);padding:0;box-shadow:0 0 0 2px var(--line)}
  .sw.sel{box-shadow:0 0 0 3px var(--pink)}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;background:var(--bg2);color:var(--mute);padding:.55em;font-size:15px;border:2px solid transparent}
  .seg button.sel{background:var(--card);color:#fff;border-color:var(--pink)}
  .pl .big{font-size:20px;width:100%;max-width:320px;padding:16px}
  .stage{height:100%;display:flex;flex-direction:column;gap:10px;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
  .stage .top{display:flex;align-items:center;gap:10px}
  .stage .top .qn{font-weight:900;color:var(--pink);font-size:18px}
  .stage .top .sp{flex:1}
  .stage .top .t{font-size:46px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;color:var(--teal);min-width:44px;text-align:right}
  .stage .top .t.hot{color:var(--red)}
  .stage .qt{font-size:19px;font-weight:800;line-height:1.35;word-break:keep-all;min-height:1.35em}
  .stage .arena{flex:1;min-height:0;width:100%;border-radius:14px}
  .stage .arena .zone .zl{padding:.35em}
  .stage .arena .zl b{font-size:54px}
  .stage .arena .z4 .zl b{font-size:16px}
  .stage .arena .zl span{font-size:19px;max-width:42vw}
  .stage .arena .zc{display:none}
  .stage .arena .startc span{font-size:9px}
  .stage .ch .e{font-size:44px}
  .stage .ch.me{z-index:5}
  .stage .ch.other{opacity:.8} .stage .ch.other .e{font-size:34px} .stage .ch.other .n{font-size:9px;background:rgba(0,0,0,.45)} .stage .ch .n{font-size:10px}
  .padwrap{flex:none;display:flex;align-items:center;justify-content:space-evenly;padding:2px 0 4px}
  .pad{position:relative;width:min(34vw,132px);aspect-ratio:1;border-radius:50%;touch-action:none;-webkit-touch-callout:none;
    background:radial-gradient(circle,var(--bg2) 0 38%,var(--card) 100%);border:2px solid var(--line);box-shadow:inset 0 0 24px #0008}
  .pad .knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 35% 30%,#ff7fb0,var(--pink));box-shadow:0 6px 0 #0007,0 0 0 2px #fff3}
  .boost{width:min(22vw,86px);aspect-ratio:1;border-radius:50%;padding:0;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:radial-gradient(circle at 35% 30%,#ffe27a,#ff9f1a);color:#3a2300;font-size:15px;font-weight:900;box-shadow:0 7px 0 #a85e00,0 0 22px #ffb02088}
  .boost b{font-size:24px;line-height:1}
  .boost:active{transform:translateY(5px);box-shadow:0 2px 0 #a85e00}
  .boost.used{background:var(--card);color:var(--mute);box-shadow:0 4px 0 #0006;filter:grayscale(1);opacity:.5}
  .stage .zone.mine{box-shadow:inset 0 0 0 3px #fff;filter:brightness(1.35);z-index:1}
  .ch .dot{position:absolute;left:50%;top:60%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#fff;border:2px solid var(--pink);z-index:-1}
  .ch.boost .e{filter:drop-shadow(0 0 .2em #ffcf3f) drop-shadow(0 0 .45em #ff9f1a)}
  .ch.boost::after{content:"💥";position:absolute;left:50%;top:35%;font-size:1.6em;transform:translate(-50%,-50%);animation:boom .5s ease-out forwards;pointer-events:none}
  .host .ch.boost::after{font-size:7vh}
  @keyframes boom{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
  .pad.off{opacity:.35}
  .stage .dead{flex:none;height:90px;display:grid;place-items:center;color:var(--mute);font-size:18px;font-weight:800}
  .host .body .arena.fix{flex:none;height:100%;aspect-ratio:2/1;max-width:100%;margin:0 auto}
  .stage .hint{font-size:13px;color:var(--mute);text-align:center;min-height:17px}
  .ovl{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;text-align:center;padding:24px;
    background:rgba(13,15,20,.82);animation:fade .3s}
  .ovl .big{font-size:84px;line-height:1}
  .ovl h2{font-size:34px;font-weight:900;line-height:1.25;word-break:keep-all}
  .ovl p{color:var(--mute);font-size:16px;line-height:1.5}
  .ovl.win h2{color:var(--teal)} .ovl.lose h2{color:var(--red)}
  @keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
/* =====================================================================
   ① Firebase 설정 — 탭 레이스와 같은 프로젝트를 그대로 써도 됩니다.
      databaseURL 이 비어 있으면 "로컬 테스트 모드"(같은 브라우저 탭끼리만 연결)
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAFhGKBsbNO78pm6NBEByg8n8MlIM4oglM",
  authDomain: "leadership-summit-94d20.firebaseapp.com",
  databaseURL: "https://leadership-summit-94d20-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "leadership-summit-94d20",
  appId: "1:589908249087:web:39fc777ada35a938a23fca"
};

/* =====================================================================
   ② 문제 — options 가 2개면 2분할(O/X), 4개면 4분할. answer 는 정답의 번호(0부터)
   ===================================================================== */
const QUESTIONS = [
  { q: "2025년·2026년 전사 JB 대표단 30명 중, 두 번째로 많은 성씨는?", options: ["권", "김", "이", "박"], answer: 2 },
  { q: "2025년·2026년 전사 JB 대표단 30명 중, 여성 JB는 몇 명이었을까?", options: ["4명", "5명", "6명", "7명"], answer: 1 },
  { q: "2025년·2026년 전사 JB 대표단 30명 중, 최연소자와 최연장자의 나이 차이는?", options: ["12살", "13살", "14살", "15살"], answer: 3 },
  { q: "2025년 COX 박소연 선임의 소속팀은 브랜드전략팀이다.", options: ["O", "X"], answer: 0 },
  { q: "올해 LG전자는 SG 목표 매출인 70조를 달성했다.", options: ["O", "X"], answer: 0 },
  { q: "LG 트윈스의 올해 최종 성적은 3위이다.", options: ["O", "X"], answer: 1 },
  { q: "올해 태어난 이재훈 간사 딸의 생일은 10월 30일이다.", options: ["O", "X"], answer: 1 },
  { q: "2026년 전사 JB 슬로건은?", options: ["JB in Action", "JB Together", "Voice of JB", "JB, Go Beyond"], answer: 0 },
  { q: "연초 CEO께서 적으신 개인 목표는?", options: ["하프마라톤 완주", "AI 전문가 되기", "책 30권 읽기", "10대 명산 완등하기"], answer: 1 },
];

/* ③ 게임 설정 */
const QUESTION_SEC = 15;     // 문항당 제한시간(초)
const READY_MS = 1500;       // 문제가 뜬 뒤 이동 시작까지 대기(ms)
const JUDGE_DELAY = 900;     // 시간 종료 후 판정까지 여유(ms) — 마지막 위치 수신 대기
const SPEED_X = 0.45;        // 이동 속도(경기장 폭/초). 상하 속도는 폰 화면 비율에 맞춰 자동 보정
const BOOST_DIST = 0.42;     // 부스트 이동 거리(경기장 폭 기준)
const BOOST_TIME = 0.18;     // 부스트 지속 시간(초)
const BOOST_EVERY_QUESTION = true;   // true: 문제마다 1번 / false: 게임 한 판에 1번

const params = new URLSearchParams(location.search);
const IS_HOST = params.has("host");

/* ---------------- DB 계층 (Firebase / 로컬) ---------------- */
async function makeDB() {
  if (FIREBASE_CONFIG.databaseURL) {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const fb = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const db = fb.getDatabase(initializeApp(FIREBASE_CONFIG));
    let offset = 0;
    fb.onValue(fb.ref(db, ".info/serverTimeOffset"), s => offset = s.val() || 0);
    return {
      mode: "firebase",
      now: () => Date.now() + offset,
      get: async p => (await fb.get(fb.ref(db, p))).val(),
      set: (p, v) => fb.set(fb.ref(db, p), v),
      update: (p, o) => fb.update(fb.ref(db, p), o),
      remove: p => fb.remove(fb.ref(db, p)),
      on: (p, cb) => fb.onValue(fb.ref(db, p), s => cb(s.val())),
      onDisconnect: (p, o) => fb.onDisconnect(fb.ref(db, p)).update(o),
    };
  }
  const PRE = "sv:";
  const listeners = new Set();
  const read = k => { try { return JSON.parse(localStorage.getItem(PRE + k)); } catch { return null; } };
  const keys = () => Array.from({ length: localStorage.length }, (_, i) => localStorage.key(i));
  function get(p) {
    const exact = read(p); if (exact != null) return exact;
    let out = null; const pre = PRE + p + "/";
    for (const k of keys()) {
      if (!k.startsWith(pre)) continue;
      const v = read(k.slice(PRE.length)); if (v == null) continue;
      const rest = k.slice(pre.length).split("/");
      out = out || {}; let o = out;
      for (let j = 0; j < rest.length - 1; j++) o = o[rest[j]] = o[rest[j]] || {};
      o[rest.at(-1)] = v;
    }
    return out;
  }
  const removeTree = p => { for (const k of keys()) if (k === PRE + p || k.startsWith(PRE + p + "/")) localStorage.removeItem(k); };
  const fire = () => listeners.forEach(l => l.cb(get(l.p)));
  addEventListener("storage", e => { if (!e.key || e.key.startsWith(PRE)) fire(); });
  return {
    mode: "local", now: () => Date.now(), get: async p => get(p),
    set: async (p, v) => { removeTree(p); if (v != null) localStorage.setItem(PRE + p, JSON.stringify(v)); fire(); },
    update: async (p, o) => { const cur = read(p) || {}; for (const k in o) { if (o[k] == null) delete cur[k]; else cur[k] = o[k]; } localStorage.setItem(PRE + p, JSON.stringify(cur)); fire(); },
    remove: async p => { removeTree(p); fire(); },
    on: (p, cb) => { const l = { p, cb }; listeners.add(l); cb(get(p)); return () => listeners.delete(l); },
    onDisconnect: () => {},
  };
}

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); }); }
async function drawQR(el, text) {
  try {
    if (!window.qrcode) await loadScript("https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js");
    const q = qrcode(0, "M"); q.addData(text); q.make();
    el.innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  } catch { el.innerHTML = `<div class="noqr">QR 생성 불가<br>(인터넷 연결 필요)</div>`; }
}
let actx;
function beep(f, d, type = "sine", v = .18) {
  try {
    actx = actx || new AudioContext();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    o.connect(g).connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d); o.stop(actx.currentTime + d);
  } catch {}
}

async function host(DB) {

  localStorage.setItem("sv-host-room", room);

  let players = {};

  const disp = new Map();

  const roster = () => Object.entries(players).filter(([, p]) => p && p.name && p.round === game.round).map(([id, p]) => ({ id, ...p }));
  const alive = () => roster().filter(p => p.alive);
  const posOf = p => (game.status === "lobby" || p.q === game.qIndex) && typeof p.x === "number" ? { x: p.x, y: p.y } : { x: .5, y: .5 };

  /* ---- 로비 ---- */
  function renderLobby() {
    screen = "lobby"; disp.clear();
    app.innerHTML = `
      <div class="host">
        <header><h1>🦑 JB 서바이벌 <span class="shapes">○△□</span></h1><div class="sp"></div>

        <div class="body">
          <section class="qrbox"><div id="qr"></div><div class="code">${room}</div><p>카메라로 QR을 찍어 참가하세요<br><small>${esc(joinURL)}</small></p></section>
          <div class="arena" id="arena"><div class="lobbymsg"><b id="cnt">0</b>명 입장</div></div>
        </div>
        <footer><div class="alive" style="color:var(--mute);font-size:2.4vh">조이스틱으로 캐릭터를 움직여 보세요. 🚀부스트도 대기실에서는 무제한 연습!</div><div class="sp" style="flex:1"></div>
          <button class="ghost" id="clear">참가자 비우기</button><button id="start">게임 시작 ▶</button></footer>
      </div>`;
    drawQR(document.getElementById("qr"), joinURL);
    document.getElementById("start").onclick = () => goQuestion(0);
    document.getElementById("clear").onclick = () => { if (confirm("참가자 목록을 모두 비울까요?")) DB.remove(`${base}/players`); };
    syncLobby();
  }
  function syncLobby() {
    const r = roster();
    document.getElementById("cnt").textContent = r.length;
    syncChars(r, new Set());
    if (game.playerCount !== r.length) DB.update(`${base}/game`, { playerCount: r.length });
  }

  /* ---- 문제 / 판정 ---- */
  function renderQuestion() {
    screen = "q"; disp.clear(); renderQuestion.idx = game.qIndex;
    const q = QUESTIONS[game.qIndex];
    app.innerHTML = `
      <div class="host">
        <header><div class="pill">Q <b>${game.qIndex + 1}</b> / ${QUESTIONS.length}</div>
          <div class="qtext">${esc(q.q)}</div><div class="tbox" id="tbox">${QUESTION_SEC}</div></header>
        <div class="tbar"><i id="tbar"></i></div>
        <div class="body"><div class="arena fix" id="arena">${zonesHTML(q)}<div class="bigcount" id="big"></div></div></div>
        <footer><div class="alive">생존 <b id="alv">0</b>명</div><div class="ghosts" id="ghosts"></div>
          <button id="next" style="display:none"></button></footer>
      </div>`;
    document.getElementById("next").onclick = advance;
    syncQuestion();
  }
  function syncQuestion() {
    const q = QUESTIONS[game.qIndex]; if (!q) return;
    const reveal = game.status === "reveal";
    const elim = new Set(reveal ? game.elim || [] : []);
    const show = roster().filter(p => p.alive || elim.has(p.id));
    syncChars(show, elim);
    // 구역별 인원
    const counts = Array(q.options.length).fill(0);
    for (const p of show) { const { x, y } = posOf(p); const z = zoneOf(x, y, q.options.length); if (z >= 0) counts[z]++; }
    document.querySelectorAll("#arena .zone").forEach(z => {
      const i = +z.dataset.z;
      z.querySelector(".zc").textContent = counts[i] + "명";
      z.classList.toggle("correct", reveal && i === q.answer);
      z.classList.toggle("wrong", reveal && i !== q.answer);
    });
    const alv = alive().length;
    document.getElementById("alv").textContent = alv;
    const dead = roster().filter(p => !p.alive && !elim.has(p.id));
    document.getElementById("ghosts").innerHTML = dead.length ? `<em>탈락 ${dead.length}</em>` + dead.map(p => `<span title="${esc(p.name)}">${avatarSVG(p.av, "head")}</span>`).join("") : "";
    const nb = document.getElementById("next");
    if (reveal) {
      nb.style.display = ""; nb.textContent = "중간 결과 ▶";
      if (!document.querySelector(".verdict")) {
        const v = document.createElement("div"); v.className = "verdict";
        const ans = isOX(q) ? q.options[q.answer] : q.options[q.answer];
        v.innerHTML = game.voided
          ? `<h2>전원 오답! 😱</h2><p>정답은 <b>${esc(ans)}</b> — 이번 문제는 무효, 모두 생존</p>`
          : `<h2>정답: ${esc(ans)}</h2><p>탈락 <b>${elim.size}</b>명 · 생존 <b>${alv}</b>명</p>`;
        document.getElementById("arena").append(v);
        setTimeout(() => v.remove(), 3500);
      }
    } else nb.style.display = "none";
  }

  function syncChars(list, elim) {
    const arena = document.getElementById("arena"); if (!arena) return;
    const ids = new Set(list.map(p => p.id));
    arena.querySelectorAll(".ch").forEach(el => { if (!ids.has(el.dataset.id)) el.remove(); });
    for (const p of list) {
      let el = arena.querySelector(`.ch[data-id="${p.id}"]`);
      if (!el) {
        el = document.createElement("div"); el.className = "ch"; el.dataset.id = p.id;
        el.innerHTML = `<span class="e">${avatarSVG(p.av)}</span><span class="n">${esc(p.name)}</span>`;
        arena.append(el);
      }
      el.classList.toggle("dead", elim.has(p.id));
      el.classList.toggle("saved", game.status === "reveal" && !game.voided && p.alive);
    }
  }

  // 같은 지점에 몰린 캐릭터가 완전히 겹치지 않도록 화면에서만 살짝 흩뿌림(판정에는 영향 없음)
  function jitter(id, t) {
    let h = 2166136261; for (const c of id) h = Math.imul(h ^ c.charCodeAt(0), 16777619); h ^= h >>> 13; h = Math.imul(h, 2246822507); h ^= h >>> 16;
    const j = { x: t.x + ((h & 255) / 255 - .5) * .05, y: t.y + (((h >> 8) & 255) / 255 - .5) * .07 };
    const q = QUESTIONS[game.qIndex], n = q ? q.options.length : 0;
    if (screen === "q" && zoneOf(j.x, j.y, n) !== zoneOf(t.x, t.y, n)) return t;
    return j;
  }
  function frame() {
    requestAnimationFrame(frame);
    if (!(screen === "q" && game.status === "question")) setBig("");
    if (screen !== "lobby" && screen !== "q") return;
    for (const el of document.querySelectorAll("#arena .ch")) {
      const p = players[el.dataset.id]; if (!p) continue;
      const t = jitter(el.dataset.id, posOf(p));
      const c = disp.get(el.dataset.id) || { x: .5, y: .5 };
      const nx = c.x + (t.x - c.x) * .25, ny = c.y + (t.y - c.y) * .25;
      disp.set(el.dataset.id, { x: nx, y: ny });
      el.style.left = (nx * 100) + "%"; el.style.top = (ny * 100) + "%";
      el.classList.toggle("walk", Math.hypot(t.x - nx, t.y - ny) > .004);
      el.classList.toggle("boost", !!p.bt && DB.now() - p.bt < 600);
    }
    if (screen === "q" && game.status === "question") {
      const now = DB.now();
      const left = Math.max(0, game.qEndAt - now), total = QUESTION_SEC * 1000;
      const before = now < game.qStartAt;
      const sec = before ? QUESTION_SEC : Math.ceil(left / 1000);
      const tb = document.getElementById("tbox");
      tb.textContent = sec; tb.classList.toggle("hot", !before && sec <= 5);
      document.getElementById("tbar").style.transform = `scaleX(${before ? 1 : left / total})`;
      if (!before && sec <= 5 && sec > 0 && lastTick !== sec) { lastTick = sec; beep(880, .12, "square", .08); }
      setBig(!before && sec <= 5 && sec > 0 ? sec : "");
      if (now >= game.qEndAt + JUDGE_DELAY && judged !== `${game.round}-${game.qIndex}`) judge();
    }
  }
  requestAnimationFrame(frame);

  async function goQuestion(i) {
    const now = DB.now();
    lastTick = null;
    await DB.update(`${base}/game`, { status: "question", qIndex: i, qStartAt: now + READY_MS, qEndAt: now + READY_MS + QUESTION_SEC * 1000, elim: null, voided: null });
  }
  async function judge() {
    judged = `${game.round}-${game.qIndex}`;
    const q = QUESTIONS[game.qIndex];
    const al = alive();
    const wrong = al.filter(p => { const { x, y } = posOf(p); return zoneOf(x, y, q.options.length) !== q.answer; });
    const voided = al.length > 0 && wrong.length === al.length;
    const elim = voided ? [] : wrong.map(p => p.id);
    await Promise.all(elim.map(id => DB.update(`${base}/players/${id}`, { alive: false, outQ: game.qIndex })));
    await DB.update(`${base}/game`, { status: "reveal", elim, voided, aliveCount: al.length - elim.length });
    if (elim.length) beep(140, .7, "sawtooth", .2); else beep(660, .25);
    setTimeout(() => beep(990, .3), 250);
    const key = judged;
    setTimeout(() => { if (game.status === "reveal" && `${game.round}-${game.qIndex}` === key) DB.update(`${base}/game`, { status: "mid" }); }, 4200);
  }
  function advance() {

    if (game.qIndex >= QUESTIONS.length - 1) DB.update(`${base}/game`, { status: "end" });

  /* ---- 중간 결과: 통과 / 탈락 ---- */

    const ans = isOX(q) ? q.options[q.answer] : q.options[q.answer];

    const who = (p, i) => `<div class="who" style="animation-delay:${Math.min(i * .08, 2)}s"><div class="e">${avatarSVG(p.av)}</div><div class="n">${esc(p.name)}</div></div>`;
    const last = game.qIndex >= QUESTIONS.length - 1;
    app.innerHTML = `
      <div class="host">
        <header><div class="pill">Q <b>${game.qIndex + 1}</b> / ${QUESTIONS.length} 결과</div>
          <div class="qtext">정답: <span style="color:var(--gold)">${esc(ans)}</span>${game.voided ? ` <span style="color:var(--mute);font-size:.7em">— 전원 오답으로 무효</span>` : ""}</div></header>
        <div class="mid">
          <section class="panel pass"><h2>✅ 통과 <b>${pass.length}</b>명</h2><div class="list" style="font-size:${size(pass.length)}">${pass.map(who).join("") || `<div class="none">생존자가 없습니다</div>`}</div></section>

        </div>
        <footer><div class="alive" style="color:var(--mute);font-size:2.4vh">누적 탈락 ${roster().length - pass.length}명</div><div style="flex:1"></div>
          ${last ? "" : `<button class="ghost" id="fin">여기서 종료 · 최종 결과 🏆</button>`}

    document.getElementById("next").onclick = advance;
    const fin = document.getElementById("fin");
    if (fin) fin.onclick = () => DB.update(`${base}/game`, { status: "end" });

  /* ---- 최종 ---- */
  function renderEnd() {
    screen = "end";
    const w = alive();
    app.innerHTML = `
      <div class="host">
        <header><h1>🦑 JB 서바이벌 <span class="shapes">○△□</span></h1><div class="sp"></div>
          <button class="ghost" id="reset">처음부터 다시</button></header>

        </div>
      </div>`;
    document.getElementById("reset").onclick = () => DB.update(`${base}/game`, { status: "lobby", round: game.round + 1, qIndex: -1, elim: null, voided: null });
    beep(523, .2); setTimeout(() => beep(659, .2), 200); setTimeout(() => beep(784, .4), 400);

  function route() {
    const s = game.status;
    if (s === "lobby") { if (screen !== "lobby") renderLobby(); else syncLobby(); }
    else if (s === "question" || s === "reveal") {
      if (screen !== "q" || renderQuestion.idx !== game.qIndex) renderQuestion(); else syncQuestion();
    } else if (s === "mid") { if (screen !== "mid" || renderMid.idx !== game.qIndex) renderMid(); }
    else if (s === "end" && screen !== "end") renderEnd();
  }
  document.addEventListener("keydown", e => {
    if (e.key !== " " && e.key !== "Enter") return;
    if (game.status === "reveal" || game.status === "mid") { e.preventDefault(); advance(); }
    else if (game.status === "lobby" && document.activeElement?.tagName !== "BUTTON") { e.preventDefault(); goQuestion(0); }
  });
  DB.on(`${base}/game`, g => { if (g) { game = g; route(); } });
  DB.on(`${base}/players`, p => {
    players = p || {};
    if (screen === "lobby") syncLobby(); else if (screen === "q") syncQuestion();
  });
}

/* =====================================================================
   참가자(휴대폰)
   ===================================================================== */
async function player(DB) {
  const room = (params.get("room") || "").toUpperCase();
  if (!room) {
    app.innerHTML = `<div class="pl"><h1>🦑 JB 서바이벌</h1><p class="sub">방 코드를 입력하세요</p>
      <input id="rc" maxlength="6" placeholder="예: AB12" autocapitalize="characters"><button class="big" id="go">참가자로 입장</button>
      <p class="sub" style="margin-top:24px">진행자(큰 스크린)이신가요?</p><button class="big ghost" id="hostbtn">🖥 진행자 화면 열기</button></div>`;
    document.getElementById("hostbtn").onclick = () => { location.search = "?host"; };
    document.getElementById("go").onclick = () => { const v = document.getElementById("rc").value.trim(); if (v) location.search = "?room=" + encodeURIComponent(v); };
    return;
  }
  const base = `sv/rooms/${room}`;
  let pid = localStorage.getItem("sv-pid"); if (!pid) { pid = randId(10); localStorage.setItem("sv-pid", pid); }
  const mePath = `${base}/players/${pid}`;

  let game = null, me = null, screen = "loading", stageKey = null;
  let allPlayers = {}, otherEls = new Map();
  const odisp = new Map();
  let pos = { x: .5, y: .5 }, tgt = { x: .5, y: .5 }, curQ = -1, lastSent = "", flushedQ = null, myRound = null;

  function showJoin() {
    screen = "join"; stageKey = null;
    let av = parseAv(localStorage.getItem("sv-av") || randomAv());
    let tab = 0;
    const TABS = ["기본", "얼굴", "머리", "모자", "의상"];
    app.innerHTML = `<div class="pl join">
      <div class="jtop"><div class="pvw" id="pvw"></div>
        <div class="jside"><input id="nm" maxlength="8" placeholder="이름 (최대 8자)" value="${esc(localStorage.getItem("sv-name") || "")}">
          <button class="ghost" id="rnd">🎲 랜덤</button></div></div>
      <div class="tabs" id="tabs">${TABS.map((t, i) => `<button data-t="${i}">${t}</button>`).join("")}</div>
      <div class="opts" id="opts"></div>
      <button class="big" id="join">참가하기</button></div>`;
    const pvw = document.getElementById("pvw"), opts = document.getElementById("opts"), tabs = document.getElementById("tabs");
    const withAv = (k, v) => { const a = av.slice(); a[k] = v; return a.join("."); };
    const range = n => Array.from({ length: n }, (_, i) => i);
    const cell = (k, v, crop) => `<button class="oc ${av[k] === v ? "sel" : ""}" data-k="${k}" data-v="${v}">${avatarSVG(withAv(k, v), crop)}</button>`;
    const sw = (k, v, c) => `<button class="sw ${av[k] === v ? "sel" : ""}" data-k="${k}" data-v="${v}" style="background:${c}"></button>`;
    const seg = (k, names) => `<div class="seg">${names.map((t, i) => `<button class="${av[k] === i ? "sel" : ""}" data-k="${k}" data-v="${i}">${t}</button>`).join("")}</div>`;
    function draw() {
      pvw.innerHTML = avatarSVG(av.join("."));
      tabs.querySelectorAll("button").forEach(b => b.classList.toggle("sel", +b.dataset.t === tab));
      const top = opts.scrollTop;
      let h;
      if (tab === 0) h = `<h4>성별</h4>${seg(0, ["남", "여"])}<h4>피부</h4><div class="grid">${SKINS.map((c, i) => sw(1, i, c)).join("")}</div>`;
      else if (tab === 1) h = `<h4>얼굴</h4><div class="grid">${range(15).map(i => cell(2, i, "head")).join("")}</div>`;
      else if (tab === 2) h = `<h4>머리 스타일</h4><div class="grid">${range(15).map(i => cell(3, i, "head")).join("")}</div><h4>머리색</h4><div class="grid">${HAIRC.map((c, i) => sw(4, i, c)).join("")}</div>`;
      else if (tab === 3) h = `<h4>모자</h4><div class="grid">${range(16).map(i => cell(5, i, "head")).join("")}</div>`;
      else h = `<h4>의상</h4>${seg(6, ["원피스", "투피스"])}<div class="grid" style="margin-top:8px">${range(15).map(i => cell(av[6] ? 8 : 7, i)).join("")}</div>`;
      opts.innerHTML = h; opts.scrollTop = top;
    }
    tabs.onclick = e => { const b = e.target.closest("[data-t]"); if (b) { tab = +b.dataset.t; opts.scrollTop = 0; draw(); } };
    opts.onclick = e => { const b = e.target.closest("[data-k]"); if (b) { av[+b.dataset.k] = +b.dataset.v; draw(); } };
    document.getElementById("rnd").onclick = () => { av = parseAv(randomAv()); draw(); };
    draw();
    document.getElementById("join").onclick = async () => {
      const name = document.getElementById("nm").value.trim().slice(0, 8);
      if (!name) { document.getElementById("nm").focus(); return; }
      const code = av.join(".");
      localStorage.setItem("sv-name", name); localStorage.setItem("sv-av", code);
      myRound = game?.round ?? 1;
      pos = { x: .5, y: .5 }; tgt = { ...pos };
      await DB.set(mePath, { name, av: code, round: myRound, alive: !game || game.status === "lobby", x: .5, y: .5, q: game?.qIndex ?? -1, joinedAt: DB.now(), online: true });
      DB.onDisconnect(mePath, { online: false });
      screen = "joined"; route();
    };
  }

  /* 무대: 상단(문항/타이머) + 문제 + 경기장 */
  function showStage() {
    const s = game.status, q = s === "lobby" ? null : QUESTIONS[game.qIndex];
    const key = `${game.round}|${s === "lobby" ? "L" : game.qIndex}`;
    if (screen === "stage" && stageKey === key) return;
    screen = "stage"; stageKey = key; otherEls = new Map();
    app.innerHTML = `<div class="stage">
      <div class="top"><span class="qn">${q ? `Q${game.qIndex + 1} / ${QUESTIONS.length}` : "대기실"}</span><div class="sp"></div><span class="t" id="t"></span></div>
      <div class="qt">${q ? esc(q.q) : `곧 시작합니다! <span style="color:var(--mute)">· ${game.playerCount || 1}명 참가 중</span>`}</div>
      <div class="arena" id="arena">${zonesHTML(q)}<div id="others"></div>${me?.alive ? `<div class="ch me" id="mech"><i class="dot"></i><span class="e">${avatarSVG(me.av)}</span><span class="n">${esc(me.name)}</span></div>` : ""}<div class="bigcount" id="big"></div></div>
      <div class="hint" id="hint"></div>
      ${me?.alive ? `<div class="padwrap"><div class="pad" id="pad"><div class="knob" id="knob"></div></div>
        <button class="boost" id="boost"><b>🚀</b><span id="boostl">부스트</span></button></div>`
        : `<div class="dead">💀 탈락 — 큰 화면으로 관전해 주세요</div>`}</div>`;
    const pad = document.getElementById("pad");
    if (pad) {
      // 조이스틱: 누른 위치까지의 방향·거리만큼 아날로그로 이동
      let ptr = null;
      const knob = document.getElementById("knob");
      const setDir = e => {
        const r = pad.getBoundingClientRect(), R = r.width * .3;
        let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy);
        if (d > R) { dx *= R / d; dy *= R / d; }
        knob.style.transform = `translate(${dx}px,${dy}px)`;
        padDir = d < R * .15 ? { x: 0, y: 0 } : { x: dx / R, y: dy / R };
      };
      const up = e => { if (e.pointerId === ptr) { ptr = null; padDir = { x: 0, y: 0 }; knob.style.transform = ""; } };
      pad.addEventListener("pointerdown", e => { e.preventDefault(); ptr = e.pointerId; pad.setPointerCapture?.(ptr); setDir(e); navigator.vibrate?.(10); });
      pad.addEventListener("pointermove", e => { if (e.pointerId === ptr) setDir(e); });
      pad.addEventListener("pointerup", up); pad.addEventListener("pointercancel", up); pad.addEventListener("lostpointercapture", up);
      pad.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
      pad.addEventListener("contextmenu", e => e.preventDefault());
      const bb = document.getElementById("boost");
      bb.addEventListener("pointerdown", e => { e.preventDefault(); doBoost(); });
      bb.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
      bb.addEventListener("contextmenu", e => e.preventDefault());
    }
    paint();
  }
  // 부스트: 대기실에서는 연습 무제한, 게임 중에는 1번
  const boostKey = () => game ? `${game.round}` + (BOOST_EVERY_QUESTION ? `-${game.qIndex}` : "") : "";
  const boostLeft = () => game?.status === "lobby" || localStorage.getItem("sv-boost-" + room) !== boostKey();
  function doBoost() {
    if (!canMove() || boost || !boostLeft()) return;
    const d = dir(), m = Math.hypot(d.x, d.y);
    const v = m > 0 ? { x: d.x / m, y: d.y / m } : facing;
    boost = { t: BOOST_TIME, x: v.x, y: v.y };
    if (game.status !== "lobby") localStorage.setItem("sv-boost-" + room, boostKey());
    DB.update(mePath, { bt: DB.now() });
    navigator.vibrate?.([30, 20, 60]); beep(220, .25, "sawtooth", .12);
  }
  function canMove() {    paint();
  }
  function canMove() {
    if (!me || !game || !me.alive) return false;
    if (game.status === "lobby") return true;
    if (game.status !== "question") return false;
    const n = DB.now(); return n >= game.qStartAt && n < game.qEndAt;
  }
  function paint() {
    const el = document.getElementById("mech");
    if (el) { el.style.left = pos.x * 100 + "%"; el.style.top = pos.y * 100 + "%"; el.classList.toggle("walk", (dir().x || dir().y) && canMove()); }
    if (el) el.classList.toggle("boost", !!boost);
    const pad = document.getElementById("pad");
    if (pad) {
      pad.classList.toggle("off", !canMove());
      const left = boostLeft(), bb = document.getElementById("boost");
      bb.classList.toggle("used", !left);
      document.getElementById("boostl").textContent = game?.status === "lobby" ? "연습" : left ? "1회" : "사용함";
    }
    // 내가 지금 판정될 구역에 불 켜기
    const q = game && game.status === "question" ? QUESTIONS[game.qIndex] : null;
    const mz = q && me?.alive ? zoneOf(pos.x, pos.y, q.options.length) : -1;
    document.querySelectorAll("#arena .zone").forEach(z => z.classList.toggle("mine", +z.dataset.z === mz));
    const t = document.getElementById("t"), h = document.getElementById("hint");
    if (!t || !game) return;
    let big = "";
    if (game.status === "question") {
      const n = DB.now();
      if (n < game.qStartAt) { t.textContent = QUESTION_SEC; t.classList.remove("hot"); h.textContent = me?.alive ? "준비…" : "💀 탈락 — 관전 중"; }
      else if (n < game.qEndAt) { const s = Math.ceil((game.qEndAt - n) / 1000); t.textContent = s; t.classList.toggle("hot", s <= 5); big = s <= 5 && s > 0 ? s : ""; h.textContent = me?.alive ? mz < 0 ? "조이스틱으로 이동! 안 움직이면 탈락" : `지금 내 선택: ${q.options[mz]}` : "💀 탈락 — 관전 중"; }
      else { t.textContent = "0"; h.textContent = "판정 중… 🥁"; }
    } else if (game.status === "lobby") { t.textContent = ""; h.textContent = "조이스틱과 🚀부스트를 연습해 보세요"; }
    setBig(big);
  }

  // 입력: 조이스틱(padDir, 아날로그) + PC 키보드 화살표(테스트용, 스페이스=부스트)
  let padDir = { x: 0, y: 0 }, facing = { x: 1, y: 0 }, boost = null;
  const keys = new Set();
  addEventListener("keydown", e => { if (e.key.startsWith("Arrow")) { keys.add(e.key); e.preventDefault(); } else if (e.key === " " && screen === "stage") { e.preventDefault(); doBoost(); } });
  addEventListener("keyup", e => keys.delete(e.key));
  addEventListener("blur", () => { keys.clear(); padDir = { x: 0, y: 0 }; });
  const dir = () => {
    if (padDir.x || padDir.y) return padDir;
    const x = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0), y = (keys.has("ArrowDown") ? 1 : 0) - (keys.has("ArrowUp") ? 1 : 0);
    const k = x && y ? Math.SQRT1_2 : 1;      // 대각선도 같은 속도
    return { x: x * k, y: y * k };
  };
  // 다른 참가자들도 내 폰 경기장에 함께 표시(진행자 화면과 같은 위치)
  function drawOthers() {
    const box = document.getElementById("others"); if (!box || !game) return;
    const elim = new Set(game.status === "reveal" ? game.elim || [] : []);
    const seen = new Set();
    for (const [id, p] of Object.entries(allPlayers)) {
      if (id === pid || !p || !p.name || p.round !== game.round) continue;
      if (!(p.alive || elim.has(id))) continue;
      seen.add(id);
      let el = otherEls.get(id);
      if (!el || !el.isConnected) {
        el = document.createElement("div"); el.className = "ch other";
        el.innerHTML = `<span class="e">${avatarSVG(p.av)}</span><span class="n">${esc(p.name)}</span>`;
        box.append(el); otherEls.set(id, el);
      }
      const t = (game.status === "lobby" || p.q === game.qIndex) && typeof p.x === "number" ? { x: p.x, y: p.y } : { x: .5, y: .5 };
      const c = odisp.get(id) || t;
      const n = { x: c.x + (t.x - c.x) * .25, y: c.y + (t.y - c.y) * .25 };
      odisp.set(id, n);
      el.style.left = n.x * 100 + "%"; el.style.top = n.y * 100 + "%";
      el.classList.toggle("walk", Math.hypot(t.x - n.x, t.y - n.y) > .004);
      el.classList.toggle("dead", elim.has(id));
      el.classList.toggle("boost", !!p.bt && DB.now() - p.bt < 600);
    }
    for (const [id, el] of otherEls) if (!seen.has(id)) { el.remove(); otherEls.delete(id); }
  }
  let lastT = performance.now();
  function loop(t) {
    requestAnimationFrame(loop);
    const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
    const d = dir();
    const ar = document.getElementById("arena"), asp = ar && ar.clientHeight ? ar.clientWidth / ar.clientHeight : 2;  // 폰 경기장 비율에 맞춰 상하 속도 보정
    const clamp = p => ({ x: Math.min(.97, Math.max(.03, p.x)), y: Math.min(.94, Math.max(.08, p.y)) });
    if (!canMove()) boost = null;
    else if (boost) {
      const step = Math.min(dt, boost.t), v = BOOST_DIST / BOOST_TIME;
      pos = clamp({ x: pos.x + boost.x * v * step, y: pos.y + boost.y * v * asp * step });
      boost.t -= step; if (boost.t <= 0) { boost = null; send(true); }
    } else if (d.x || d.y) {
      const m = Math.hypot(d.x, d.y); facing = { x: d.x / m, y: d.y / m };
      pos = clamp({ x: pos.x + d.x * SPEED_X * dt, y: pos.y + d.y * SPEED_X * asp * dt });
    }
    if (screen === "stage") { paint(); drawOthers(); }
    // 시간 종료 순간 최종 위치 즉시 전송
    if (game?.status === "question" && me?.alive && DB.now() >= game.qEndAt && flushedQ !== game.qIndex) { flushedQ = game.qIndex; send(true); }
  }
  requestAnimationFrame(loop);
  function send(force) {
    if (!me) return;
    const k = `${pos.x.toFixed(3)},${pos.y.toFixed(3)},${curQ}`;
    if (!force && k === lastSent) return;
    lastSent = k;
    DB.update(mePath, { x: +pos.x.toFixed(4), y: +pos.y.toFixed(4), q: curQ });
  }
  setInterval(() => { if (canMove()) send(); }, 120);

  function overlay(cls, big, title, sub) {
    document.querySelector(".ovl")?.remove();
    const o = document.createElement("div"); o.className = "ovl " + cls;
    o.innerHTML = `<div class="big">${big}</div><h2>${title}</h2><p>${sub}</p>`;
    document.body.append(o); navigator.vibrate?.(cls === "lose" ? [80, 60, 200] : 60);
    return o;
  }

  function route() {
    if (!game) { if (screen !== "join") { screen = "wait"; app.innerHTML = `<div class="pl"><h1>🦑</h1><p class="sub">진행자 화면이 열리기를 기다리는 중…</p></div>`; } return; }
    if (!me) { if (screen !== "join") showJoin(); return; }
    if (game.round !== myRound) {               // 새 게임: 부활
      myRound = game.round; me.alive = true;
      DB.update(mePath, { round: myRound, alive: true, outQ: null });
    }
    const s = game.status;
    if (s !== "reveal" && s !== "mid" && s !== "end") document.querySelector(".ovl")?.remove();
    if (s === "question" && curQ !== game.qIndex) {   // 새 문제: 출발점으로
      curQ = game.qIndex; pos = { x: .5, y: .5 }; tgt = { ...pos }; flushedQ = null; send(true);
    }
    if (s === "lobby") { curQ = -1; showStage(); }
    else if (s === "question") showStage();
    else if (s === "reveal" || s === "mid") {
      showStage();
      const key = `${game.round}-${game.qIndex}`;
      if (route.shown === key) return; route.shown = key;
      const q = QUESTIONS[game.qIndex];
      const ans = isOX(q) ? q.options[q.answer] : q.options[q.answer];
      const out = (game.elim || []).includes(pid);
      if (out) overlay("lose", "💀", "탈락", `정답은 <b>${esc(ans)}</b>였어요<br>남은 게임은 관전 모드로 볼 수 있어요`);
      else if (!me.alive) overlay("", "👻", "관전 중", `정답은 <b>${esc(ans)}</b> · 생존 ${game.aliveCount}명`);
      else if (game.voided) overlay("win", "😱", "전원 오답!", `정답은 <b>${esc(ans)}</b> — 이번 문제는 무효, 모두 생존`);
      else overlay("win", "🎉", "생존!", `정답 <b>${esc(ans)}</b> · 생존 ${game.aliveCount}명`);
    } else if (s === "end") {
      if (route.shown === "end" + game.round) return; route.shown = "end" + game.round;
      if (me.alive) overlay("win", "🏆", "최종 생존!", "끝까지 살아남았습니다 👑");
      else overlay("", "👏", "게임 종료", "수고하셨습니다!");
    }
  }

  const first = await DB.get(mePath);
  if (first?.name) {
    me = first; myRound = first.round;
    if (typeof first.x === "number") { pos = { x: first.x, y: first.y }; tgt = { ...pos }; curQ = first.q ?? -1; }
    DB.update(mePath, { online: true }); DB.onDisconnect(mePath, { online: false });
  }
  DB.on(`${base}/players`, p => { allPlayers = p || {}; });
  DB.on(mePath, r => {
    const had = !!me;
    me = r && r.name ? r : null;
    if (had && !me) { showJoin(); return; }
    if (me && screen === "stage" && !me.alive && document.getElementById("mech")) { stageKey = null; route(); }
    if (!had && me && screen === "join") route();
  });
  DB.on(`${base}/game`, g => {
    const prevCount = game?.playerCount; game = g;
    if (game?.status === "lobby" && screen === "stage" && prevCount !== g.playerCount) stageKey = null;
    if (screen !== "join") route();
  });
  if (!me && screen === "loading") showJoin();
}

/* ---------------- 시작 ---------------- */
const DB = await makeDB().catch(err => { app.innerHTML = `<div class="pl"><h1>연결 실패</h1><p class="sub">${esc(err.message)}</p></div>`; throw err; });
if (DB.mode === "local") document.body.insertAdjacentHTML("beforeend", `<div class="banner">로컬 테스트 모드 — Firebase 설정 전에는 같은 PC·같은 브라우저의 탭끼리만 연결됩니다</div>`);
(IS_HOST ? host : player)(DB);
</script>
